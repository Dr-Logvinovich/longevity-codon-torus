name: Zero-RNG Longevity Torus Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify-zero-rng:
    name: 64/64 Self-Tests, Zero-RNG AST & Archive Integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scientific dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy matplotlib

      - name: 1. Static AST Zero-RNG & SHA-256 Engine Audit
        run: |
          python3 - <<'PY'
          import ast, hashlib
          from pathlib import Path

          src_path = Path("tortoise_longevity_torus_v1_0.py")
          raw = src_path.read_bytes()
          sha = hashlib.sha256(raw).hexdigest()
          expected = "a509e148a8c0608be7d3c81d74168b3e3ac318f30854a26c38e104c97bb545db"
          assert sha == expected, f"Engine SHA-256 mismatch: {sha} != {expected}"

          tree = ast.parse(raw.decode("utf-8"))
          banned = {"random", "secrets", "numpy.random"}
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  for alias in node.names:
                      assert alias.name not in banned, f"Forbidden RNG import: {alias.name}"
              elif isinstance(node, ast.ImportFrom):
                  mod = node.module or ""
                  assert mod not in banned and not mod.startswith("numpy.random"), f"Forbidden RNG import: {mod}"
              elif isinstance(node, ast.Attribute) and node.attr == "random":
                  raise AssertionError("Forbidden .random attribute usage detected")

          print(f"[PASS] Static AST Zero-RNG clean | SHA-256 verified: {sha[:16]}...")
          PY

      - name: 2. Execute 64/64 Automated Algebraic Self-Tests
        run: |
          python3 tortoise_longevity_torus_v1_0.py --self-test

      - name: 3. Verify 30-Species Audited Edition v1.6 Archive Integrity
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          required_files = [
              "longevity_torus_v1_6.pdf",
              "longevity_torus_v1_6.tex",
              "tortoise_longevity_torus_v1_0.py",
              "tortoise_ncbi_manifest.json",
              "CITATION.cff",
              "README.md",
              "results_tortoise_v1_5/extremes_immortals_audit.json",
              "results_tortoise_v1_5/extremes_immortals_audit.md",
              "results_tortoise_v1_5/deep_toric_physics_L8.json",
              "results_tortoise_v1_5/deep_toric_physics_L8.md",
              "results_tortoise_v1_5/figures/fig_L7_immortals_and_extremes_atlas.png",
              "results_tortoise_v1_5/figures/fig_L8_extremes_ideogram.png",
              "results_tortoise_v1_5/figures/fig_L9_deep_memory_and_evolutionary_clock.png",
              "results_tortoise_v1_5/figures/fig_L10_metazoan_invariants.png",
          ]
          missing = [f for f in required_files if not Path(f).is_file() or Path(f).stat().st_size == 0]
          assert not missing, f"Missing or empty archive files: {missing}"

          ext = json.loads(Path("results_tortoise_v1_5/extremes_immortals_audit.json").read_text(encoding="utf-8"))
          deep = json.loads(Path("results_tortoise_v1_5/deep_toric_physics_L8.json").read_text(encoding="utf-8"))
          assert ext["n_species_total"] == 30, f"Expected 30 species in Track C, got {ext['n_species_total']}"
          assert ext["n_mortal_vertebrates"] == 17, f"Expected 17 mortal vertebrates, got {ext['n_mortal_vertebrates']}"
          assert ext["n_sauropsids"] == 8, f"Expected 8 sauropsids, got {ext['n_sauropsids']}"
          assert deep["n_species"] == 30, f"Expected 30 species in Track D, got {deep['n_species']}"
          assert len(deep["evolutionary_clock_L8"]) == 17, f"Expected 17 clock pairs, got {len(deep['evolutionary_clock_L8'])}"

          n_chr_ckpt = len(list(Path("chr_audit_cache").glob("*.json")))
          n_gene_fa = len(list(Path("gene_cache").glob("*.fna.gz")))
          assert n_chr_ckpt >= 80, f"Too few chr_audit_cache JSON checkpoints: {n_chr_ckpt}"
          assert n_gene_fa == 338, f"Expected 338 gene_cache transcripts, got {n_gene_fa}"

          print(f"[PASS] Archive integrity OK: 30 species, 17 clock pairs, {n_chr_ckpt} chr checkpoints, {n_gene_fa} transcripts.")
          PY
